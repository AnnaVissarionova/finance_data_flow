# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:3.3.1
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common

  build: .

  env_file:
    - ${ENV_FILE_PATH:-.env}

  environment:
    &airflow-common-env

    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}

    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET}
    MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET}
    MINIO_GOLD_BUCKET: ${MINIO_GOLD_BUCKET}
    MINIO_ANALYTICS_BUCKET: ${MINIO_ANALYTICS_BUCKET}

    AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    AWS_REGION: us-east-1

    DUCKDB_S3_ENDPOINT: minio:9000
    DUCKDB_S3_USE_SSL: "false"
    DUCKDB_S3_URL_STYLE: path

    FRANKFURTER_API_URL: ${FRANKFURTER_API_URL}

    PYTHONPATH: /opt/airflow

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

    AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
    - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on

    redis:
      condition: service_healthy

    postgres:
      condition: service_healthy


# ============================================================
# SUPERSET COMMON
# ============================================================

x-superset-image: &superset-image apache/superset:6.0.0

x-superset-depends-on:
  &superset-depends-on

  - superset-db
  - redis


services:

  # ============================================================
  # AIRFLOW POSTGRES
  # ============================================================

  postgres:

    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "airflow"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: always


  # ============================================================
  # REDIS
  # ============================================================

  redis:

    image: redis:7.2-bookworm

    expose:
      - "6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always


  # ============================================================
  # MINIO
  # ============================================================

  minio:

    image: minio/minio:latest

    container_name: finance_minio

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    volumes:
      - minio-data:/data

    restart: always


  # ============================================================
  # SUPERSET DATABASE
  # ============================================================

  superset-db:

    image: postgres:16

    container_name: finance_superset_db

    env_file:
      - ./superset/docker/.env-non-dev

    volumes:
      - superset-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U superset -d superset"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # SUPERSET
  # ============================================================

  superset:

    image: *superset-image

    container_name: finance_superset

    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_REGION=us-east-1
      - DUCKDB_S3_ENDPOINT=http://minio:9000
      # Для Minio также нужны дополнительные переменные, нестандартные для AWS
      - DUCKDB_S3_USE_SSL=false
      - DUCKDB_S3_URL_STYLE=path

    env_file:
      - ./superset/docker/.env-non-dev

    command:
      [
        "/app/docker/docker-bootstrap.sh",
        "app-gunicorn"
      ]

    user: "root"

    ports:
      - "8088:8088"

    restart: unless-stopped

    depends_on:
      - superset-db
      - redis

    volumes:
      - ./superset/docker:/app/docker
      - superset-home:/app/superset_home


  # ============================================================
  # SUPERSET INIT
  # ============================================================

  superset-init:

    image: *superset-image

    container_name: finance_superset_init

    command:
      [
        "/app/docker/docker-init.sh"
      ]

    env_file:
      - ./superset/docker/.env-non-dev

    depends_on:
      - superset-db
      - redis

    user: "root"

    volumes:
      - ./superset/docker:/app/docker
      - superset-home:/app/superset_home


  # ============================================================
  # SUPERSET WORKER
  # ============================================================

  superset-worker:

    image: *superset-image

    container_name: finance_superset_worker

    command:
      [
        "/app/docker/docker-bootstrap.sh",
        "worker"
      ]

    env_file:
      - ./superset/docker/.env-non-dev

    restart: unless-stopped

    depends_on:
      - superset-db
      - redis

    user: "root"

    volumes:
      - ./superset/docker:/app/docker
      - superset-home:/app/superset_home


  # ============================================================
  # SUPERSET WORKER BEAT
  # ============================================================

  superset-worker-beat:

    image: *superset-image

    container_name: finance_superset_worker_beat

    command:
      [
        "/app/docker/docker-bootstrap.sh",
        "beat"
      ]

    env_file:
      - ./superset/docker/.env-non-dev

    restart: unless-stopped

    depends_on:
      - superset-db
      - redis

    user: "root"

    volumes:
      - ./superset/docker:/app/docker
      - superset-home:/app/superset_home


  # ============================================================
  # AIRFLOW API SERVER
  # ============================================================

  airflow-apiserver:

    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/api/v2/monitor/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:

      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ============================================================
  # AIRFLOW SCHEDULER
  # ============================================================

  airflow-scheduler:

    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:

      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ============================================================
  # AIRFLOW DAG PROCESSOR
  # ============================================================

  airflow-dag-processor:

    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"'
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:

      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ============================================================
  # AIRFLOW WORKER
  # ============================================================

  airflow-worker:

    <<: *airflow-common

    command: celery worker

    environment:

      <<: *airflow-common-env

      DUMB_INIT_SETSID: "0"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:

      <<: *airflow-common-depends-on

      airflow-apiserver:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully


  # ============================================================
  # AIRFLOW TRIGGERER
  # ============================================================

  airflow-triggerer:

    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"'
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:

      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ============================================================
  # AIRFLOW INIT
  # ============================================================

  airflow-init:

    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |

        if [[ -z "${AIRFLOW_UID}" ]]; then
          export AIRFLOW_UID=$$(id -u)
        fi

        mkdir -p /opt/airflow/{logs,dags,plugins,config}

        echo "Airflow version:"
        /entrypoint airflow version

        echo "Initializing Airflow database..."

        /entrypoint airflow db migrate

        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/

    environment:

      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: "true"

      _AIRFLOW_WWW_USER_CREATE: "true"

      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}

      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

      _PIP_ADDITIONAL_REQUIREMENTS: ""

    user: "0:0"


  # ============================================================
  # AIRFLOW CLI
  # ============================================================

  airflow-cli:

    <<: *airflow-common

    profiles:
      - debug

    environment:

      <<: *airflow-common-env

      CONNECTION_CHECK_MAX_COUNT: "0"

    command:
      - bash
      - -c
      - airflow

    depends_on:

      <<: *airflow-common-depends-on


# ============================================================
# VOLUMES
# ============================================================

volumes:

  postgres-db-volume:

  minio-data:

  superset-db-volume:

  superset-home: